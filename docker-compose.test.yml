services:
  postgres-test:
    image: postgres:17-alpine
    container_name: dlicious-postgres-test
    environment:
      POSTGRES_DB: dlicious_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - '5433:5432' # Different port to avoid conflicts with dev database
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis-test:
    image: redis:8-alpine
    container_name: dlicious-redis-test
    command: redis-server --appendonly yes
    ports:
      - '6380:6379' # Different port to avoid conflicts with dev Redis
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_test_data:
  redis_test_data:
