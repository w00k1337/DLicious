name: Optimized CI Pipeline

# Unified CI workflow optimized for speed and efficiency
# - Smart change detection to skip unnecessary work
# - Efficient caching with shared dependencies
# - Parallel job execution where possible
# - Early termination on failures

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

# Global environment variables for consistency
env:
  NODE_VERSION: '22.14.0'
  PNPM_VERSION: '10.13.1'
  # Disable Husky hooks in CI
  HUSKY: 0
  # Enable CI mode for tools
  CI: true

jobs:
  # Detect changes to determine which jobs need to run
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # Source code changes
      typescript: ${{ steps.changes.outputs.typescript }}
      javascript: ${{ steps.changes.outputs.javascript }}
      styles: ${{ steps.changes.outputs.styles }}
      config: ${{ steps.changes.outputs.config }}

      # Test-related changes
      tests: ${{ steps.changes.outputs.tests }}
      src: ${{ steps.changes.outputs.src }}

      # Infrastructure changes
      dependencies: ${{ steps.changes.outputs.dependencies }}
      docker: ${{ steps.changes.outputs.docker }}
      workflows: ${{ steps.changes.outputs.workflows }}

      # Computed flags for job conditions
      code-changed: ${{ steps.changes.outputs.typescript == 'true' || steps.changes.outputs.javascript == 'true' || steps.changes.outputs.config == 'true' }}
      test-needed: ${{ steps.changes.outputs.tests == 'true' || steps.changes.outputs.src == 'true' || steps.changes.outputs.dependencies == 'true' }}
      build-needed: ${{ steps.changes.outputs.typescript == 'true' || steps.changes.outputs.javascript == 'true' || steps.changes.outputs.styles == 'true' || steps.changes.outputs.config == 'true' || steps.changes.outputs.dependencies == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            typescript:
              - 'src/**/*.ts'
              - 'src/**/*.tsx'
              - '**/*.d.ts'
            javascript:
              - 'src/**/*.js'
              - 'src/**/*.jsx'
              - '**/*.config.js'
              - '**/*.config.mjs'
            styles:
              - 'src/**/*.css'
              - 'tailwind.config.ts'
              - 'postcss.config.js'
            config:
              - 'next.config.ts'
              - 'tsconfig.json'
              - 'vitest.config.ts'
              - 'eslint.config.js'
            tests:
              - 'src/**/*.test.ts'
              - 'src/**/*.test.tsx'
              - 'src/**/*.spec.ts'
              - 'src/**/*.spec.tsx'
            src:
              - 'src/**/*.ts'
              - 'src/**/*.tsx'
            dependencies:
              - 'package.json'
              - 'pnpm-lock.yaml'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
            workflows:
              - '.github/workflows/**'

  # Shared setup job to prepare environment
  setup:
    name: ⚙️ Setup Environment
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.build-needed == 'true'
    outputs:
      dependency-cache-key: ${{ steps.cache-keys.outputs.dependency-cache-key }}
      build-cache-key: ${{ steps.cache-keys.outputs.build-cache-key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # Generate cache keys for downstream jobs
      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "dependency-cache-key=${{ runner.os }}-deps-${{ hashFiles('**/pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT
          echo "build-cache-key=${{ runner.os }}-build-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('src/**/*', 'next.config.ts', 'tsconfig.json') }}" >> $GITHUB_OUTPUT

      # Cache dependencies globally
      - name: Cache dependencies
        uses: actions/cache@v4
        id: deps-cache
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ steps.cache-keys.outputs.dependency-cache-key }}
          restore-keys: |
            ${{ runner.os }}-deps-

      # Install dependencies only if cache miss
      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # Cache build artifacts for reuse
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            src/generated
            dist
          key: ${{ steps.cache-keys.outputs.build-cache-key }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-build-

      # Generate Prisma client for all jobs that need it
      - name: Generate Prisma client
        run: pnpm prisma generate --no-hints

  # Parallel linting and formatting checks
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    needs: [detect-changes, setup]
    if: needs.detect-changes.outputs.code-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: 'Prettier'
            command: 'prettier:check'
            condition: 'true'
          - name: 'ESLint'
            command: 'lint:js'
            condition: ${{ needs.detect-changes.outputs.typescript == 'true' || needs.detect-changes.outputs.javascript == 'true' }}
          - name: 'TypeScript'
            command: 'tsc --noEmit'
            condition: ${{ needs.detect-changes.outputs.typescript == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ needs.setup.outputs.dependency-cache-key }}
          fail-on-cache-miss: true

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .next/cache
            src/generated
            dist
          key: ${{ needs.setup.outputs.build-cache-key }}

      - name: Run ${{ matrix.check.name }}
        if: ${{ matrix.check.condition }}
        run: pnpm ${{ matrix.check.command }}

  # Tests with optimal caching
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    needs: [detect-changes, setup]
    if: needs.detect-changes.outputs.test-needed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ needs.setup.outputs.dependency-cache-key }}
          fail-on-cache-miss: true

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .next/cache
            src/generated
            dist
          key: ${{ needs.setup.outputs.build-cache-key }}

      # Cache Vitest-specific artifacts
      - name: Cache Vitest
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vitest
            coverage
          key: ${{ runner.os }}-vitest-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.test.*', 'vitest.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vitest-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-vitest-

      - name: Run tests
        run: pnpm test:run
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Build verification
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [detect-changes, setup]
    if: needs.detect-changes.outputs.build-needed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ needs.setup.outputs.dependency-cache-key }}
          fail-on-cache-miss: true

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .next/cache
            src/generated
            dist
          key: ${{ needs.setup.outputs.build-cache-key }}

      - name: Build application
        run: pnpm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Cache build output
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .next/cache
            src/generated
            dist
          key: ${{ needs.setup.outputs.build-cache-key }}

  # Final status check
  ci-status:
    name: ✅ CI Status
    runs-on: ubuntu-latest
    needs: [detect-changes, lint, test, build]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          # Check if any required job failed
          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.test.result }}" == "failure" || "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          elif [[ "${{ needs.lint.result }}" == "skipped" && "${{ needs.test.result }}" == "skipped" && "${{ needs.build.result }}" == "skipped" ]]; then
            echo "⏭️ All jobs were skipped (no relevant changes detected)"
          else
            echo "✅ All CI jobs passed successfully"
          fi
