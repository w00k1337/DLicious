name: Optimized Dependabot Auto-merge

# Enhanced Dependabot workflow with:
# - Smart dependency categorization
# - Automated testing before merge
# - Security scanning for dependencies
# - Configurable risk levels

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  # Fast check if this is a Dependabot PR
  check-dependabot:
    name: 🤖 Check Dependabot PR
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.actor == 'dependabot[bot]'
    outputs:
      is-dependabot: ${{ github.actor == 'dependabot[bot]' }}
      update-type: ${{ steps.metadata.outputs.update-type }}
      dependency-names: ${{ steps.metadata.outputs.dependency-names }}
      dependency-type: ${{ steps.metadata.outputs.dependency-type }}
      package-ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log dependency info
        run: |
          echo "🔍 Dependency update detected:"
          echo "  📦 Package: ${{ steps.metadata.outputs.dependency-names }}"
          echo "  🔄 Update type: ${{ steps.metadata.outputs.update-type }}"
          echo "  📂 Ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}"
          echo "  🏷️ Type: ${{ steps.metadata.outputs.dependency-type }}"

  # Quick validation for safe updates
  validate-update:
    name: ✅ Validate Update Safety
    runs-on: ubuntu-latest
    needs: check-dependabot
    if: needs.check-dependabot.outputs.is-dependabot == 'true'
    timeout-minutes: 5
    outputs:
      is-safe-update: ${{ steps.safety-check.outputs.is-safe }}
      should-test: ${{ steps.safety-check.outputs.should-test }}

    steps:
      - name: Determine update safety
        id: safety-check
        run: |
          UPDATE_TYPE="${{ needs.check-dependabot.outputs.update-type }}"
          DEPENDENCY_TYPE="${{ needs.check-dependabot.outputs.dependency-type }}"
          PACKAGE_ECOSYSTEM="${{ needs.check-dependabot.outputs.package-ecosystem }}"

          # Default to unsafe
          IS_SAFE="false"
          SHOULD_TEST="true"

          # Safe updates that can be auto-merged with minimal testing
          if [[ "$UPDATE_TYPE" == "version-update:semver-patch" ]]; then
            IS_SAFE="true"
            SHOULD_TEST="false"
            echo "✅ Patch update - considered safe"
          elif [[ "$UPDATE_TYPE" == "version-update:semver-minor" && "$DEPENDENCY_TYPE" == "indirect" ]]; then
            IS_SAFE="true"
            SHOULD_TEST="false"
            echo "✅ Minor update of indirect dependency - considered safe"
          elif [[ "$UPDATE_TYPE" == "version-update:semver-minor" && "$DEPENDENCY_TYPE" == "direct:development" ]]; then
            IS_SAFE="true"
            SHOULD_TEST="true"
            echo "⚠️ Minor update of dev dependency - testing required"
          else
            echo "⚠️ $UPDATE_TYPE update requires manual review"
          fi

          echo "is-safe=$IS_SAFE" >> $GITHUB_OUTPUT
          echo "should-test=$SHOULD_TEST" >> $GITHUB_OUTPUT

  # Optional testing for certain dependency types
  test-update:
    name: 🧪 Test Dependency Update
    runs-on: ubuntu-latest
    needs: [check-dependabot, validate-update]
    if: needs.validate-update.outputs.should-test == 'true' && needs.validate-update.outputs.is-safe-update == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-dependencies: 'true'

      - name: Generate Prisma client
        run: pnpm prisma generate --no-hints

      # Quick smoke tests for dependency updates
      - name: Run quick tests
        run: |
          # Run linting to catch obvious issues
          echo "🔍 Running linting checks..."
          pnpm run lint:js --max-warnings 0

          # Type check to ensure no breaking changes
          echo "🔍 Running type checks..."
          pnpm tsc --noEmit

          # Quick build test
          echo "🏗️ Testing build..."
          pnpm run build
        env:
          SKIP_ENV_VALIDATION: true
          CI: true

      # Run a subset of critical tests
      - name: Run critical tests
        run: |
          # Only run tests if they exist and this is a production dependency
          if [[ "${{ needs.check-dependabot.outputs.dependency-type }}" == "direct:production" ]]; then
            echo "🧪 Running critical tests for production dependency..."
            pnpm run test:run --reporter=basic
          else
            echo "ℹ️ Skipping tests for non-production dependency"
          fi
        env:
          CI: true
          NODE_ENV: test

  # Auto-merge for safe updates
  auto-merge:
    name: 🔀 Auto-merge Safe Updates
    runs-on: ubuntu-latest
    needs: [check-dependabot, validate-update, test-update]
    # Run if it's safe and tests passed (or weren't needed)
    if: |
      always() && 
      needs.check-dependabot.outputs.is-dependabot == 'true' && 
      needs.validate-update.outputs.is-safe-update == 'true' && 
      (needs.test-update.result == 'success' || needs.test-update.result == 'skipped')
    timeout-minutes: 5
    steps:
      - name: Auto-approve PR
        run: |
          echo "👍 Auto-approving safe dependency update"
          gh pr review --approve "$PR_URL" --body "🤖 Auto-approved by Dependabot workflow - safe dependency update detected"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: |
          echo "🔀 Enabling auto-merge for safe dependency update"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add success comment
        run: |
          DEPENDENCY_NAMES="${{ needs.check-dependabot.outputs.dependency-names }}"
          UPDATE_TYPE="${{ needs.check-dependabot.outputs.update-type }}"

          gh pr comment "$PR_URL" --body "🤖 **Auto-merge enabled**

          This $UPDATE_TYPE update for \`$DEPENDENCY_NAMES\` has been automatically approved and will be merged when all checks pass.

          **Safety checks performed:**
          - ✅ Update type classification
          - ✅ Dependency risk assessment
          $(if [[ "${{ needs.test-update.result }}" == "success" ]]; then echo "- ✅ Automated testing"; fi)

          The PR will be automatically merged using squash strategy."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Notification for manual review required
  manual-review:
    name: 👁️ Manual Review Required
    runs-on: ubuntu-latest
    needs: [check-dependabot, validate-update]
    if: |
      always() && 
      needs.check-dependabot.outputs.is-dependabot == 'true' && 
      needs.validate-update.outputs.is-safe-update == 'false'
    timeout-minutes: 2
    steps:
      - name: Add manual review comment
        run: |
          DEPENDENCY_NAMES="${{ needs.check-dependabot.outputs.dependency-names }}"
          UPDATE_TYPE="${{ needs.check-dependabot.outputs.update-type }}"
          DEPENDENCY_TYPE="${{ needs.check-dependabot.outputs.dependency-type }}"

          gh pr comment "$PR_URL" --body "👁️ **Manual review required**

          This $UPDATE_TYPE update for \`$DEPENDENCY_NAMES\` requires manual review before merging.

          **Review needed because:**
          - 🔄 Update type: $UPDATE_TYPE
          - 📦 Dependency type: $DEPENDENCY_TYPE
          - ⚠️ Potential for breaking changes or security implications

          **Next steps:**
          1. Review the changelog and breaking changes
          2. Test the application thoroughly
          3. Approve and merge when ready

          **Auto-merge criteria:** Only patch updates and minor updates of indirect dependencies are auto-merged."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
