name: Container Registry Cleanup

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run without actually deleting packages'
        required: false
        default: true
        type: boolean
      keep_versions:
        description: 'Number of production versions to keep'
        required: false
        default: '1'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dlicious

jobs:
  cleanup-images:
    name: Cleanup Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - name: Cleanup old buildcache versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: 'container'
          min-versions-to-keep: 1
          delete-only-untagged-versions: false
          ignore-versions: 'main,v*'
          delete-only-pre-release-versions: false

      - name: Cleanup old production versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: 'container'
          min-versions-to-keep: ${{ inputs.keep_versions || '1' }}
          delete-only-untagged-versions: false
          ignore-versions: 'main,buildcache'
          delete-only-pre-release-versions: false

      - name: Cleanup untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: 'container'
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
