name: Container Registry Cleanup

on:
  schedule:
    # Run every Sunday at 2:00 AM UTC to minimize impact during development
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run without actually deleting packages'
        required: false
        default: false
        type: boolean
      force_cleanup:
        description: 'Force cleanup even if recent activity detected'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  cleanup-main-images:
    name: Cleanup Main Application Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    steps:
      - name: Log cleanup parameters
        run: |
          echo "🧹 Starting main image cleanup for ${{ env.IMAGE_NAME }}"
          echo "Dry run: ${{ github.event.inputs.dry_run || 'false' }}"
          echo "Force cleanup: ${{ github.event.inputs.force_cleanup || 'false' }}"

      - name: Cleanup untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.repository }}
          package-type: 'container'
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old PR images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.repository }}
          package-type: 'container'
          min-versions-to-keep: 0
          delete-only-pre-release-versions: true
          ignore-versions: '^(main|v\d+\.\d+\.\d+)$'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old branch versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.repository }}
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
          ignore-versions: '^v\d+\.\d+\.\d+'
          token: ${{ secrets.GITHUB_TOKEN }}

  cleanup-build-cache:
    name: Cleanup Build Cache Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 5
    steps:
      - name: Prepare repository name for build cache
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log build cache cleanup
        run: |
          echo "🗑️ Starting build cache cleanup for ${{ steps.repo.outputs.name }}"
          echo "Target package: ${{ steps.repo.outputs.name }}/buildcache"

      - name: Cleanup build cache versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: '${{ steps.repo.outputs.name }}/buildcache'
          package-type: 'container'
          min-versions-to-keep: 3
          delete-only-untagged-versions: false
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  cleanup-summary:
    name: Cleanup Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [cleanup-main-images, cleanup-build-cache]
    if: always()
    steps:
      - name: Report cleanup results
        run: |
          echo "📊 Container Registry Cleanup Summary"
          echo "====================================="
          echo "Main images cleanup: ${{ needs.cleanup-main-images.result }}"
          echo "Build cache cleanup: ${{ needs.cleanup-build-cache.result }}"
          echo ""
          if [[ "${{ needs.cleanup-main-images.result }}" == "success" && "${{ needs.cleanup-build-cache.result }}" == "success" ]]; then
            echo "✅ All cleanup jobs completed successfully"
          elif [[ "${{ needs.cleanup-main-images.result }}" == "failure" || "${{ needs.cleanup-build-cache.result }}" == "failure" ]]; then
            echo "❌ Some cleanup jobs failed - check logs above"
            exit 1
          else
            echo "⚠️ Some cleanup jobs were skipped or cancelled"
          fi
