name: Validate PR Title

# This workflow validates that pull request titles follow the Conventional Commits specification
# It runs on PR creation, edits, and reopening to ensure consistent commit history
# when using "Squash and merge" strategy, as GitHub uses the PR title as the commit message

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

permissions:
  pull-requests: read

jobs:
  validate_title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate PR Title with Conventional Commit
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
