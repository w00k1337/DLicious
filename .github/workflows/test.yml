name: Tests

# This workflow runs the test suite using Vitest
# It performs:
# - Unit tests with coverage reporting
# - Component tests using Testing Library
# - Integration tests

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  # Add actions permission for caching
  actions: write

jobs:
  detect_test_changes:
    name: Detect Test-Related Changes
    runs-on: ubuntu-latest

    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      src: ${{ steps.filter.outputs.src }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      should_test: ${{ steps.filter.outputs.tests == 'true' || steps.filter.outputs.src == 'true' || steps.filter.outputs.dependencies == 'true' }}

    steps:
      - name: Identify Changed Files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tests:
              - added|modified: '**/*.test.ts'
              - added|modified: '**/*.test.tsx'
              - added|modified: '**/*.spec.ts'
              - added|modified: '**/*.spec.tsx'
              - added|modified: 'src/test/**/*'
              - added|modified: 'vitest.config.ts'
            src:
              - added|modified: 'src/**/*.ts'
              - added|modified: 'src/**/*.tsx'
            dependencies:
              - added|modified: 'package.json'
              - added|modified: 'pnpm-lock.yaml'

  test:
    name: Run Test Suite
    needs: detect_test_changes
    if: ${{ needs.detect_test_changes.outputs.should_test == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.13.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - name: Install Node.js Dependencies
        run: pnpm install
        env:
          HUSKY: 0

      - name: Restore Vitest Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm
            node_modules/.vitest
          key: ${{ runner.os }}-vitest-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.test.ts', '**/*.test.tsx', '**/*.spec.ts', '**/*.spec.tsx') }}
          restore-keys: |
            ${{ runner.os }}-vitest-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Run Tests
        run: pnpm run test:coverage
        env:
          # Disable watch mode and enable CI mode
          CI: true
          NODE_ENV: test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results.xml
          retention-days: 7

  # Optional: Run tests on multiple Node.js versions
  test_matrix:
    name: Test on Node.js ${{ matrix.node-version }}
    if: ${{ needs.detect_test_changes.outputs.should_test == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: detect_test_changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.13.1'

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install
        env:
          HUSKY: 0

      - name: Run Tests
        run: pnpm run test:coverage
        env:
          CI: true
          NODE_ENV: test
