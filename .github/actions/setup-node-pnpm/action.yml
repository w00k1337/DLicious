name: 'Setup Node.js and pnpm'
description: 'Composite action to set up Node.js and pnpm with optimal caching'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22.14.0'
  pnpm-version:
    description: 'pnpm version to use'
    required: false
    default: '10.13.1'
  install-dependencies:
    description: 'Whether to install dependencies'
    required: false
    default: 'true'
  cache-key-suffix:
    description: 'Additional suffix for cache key'
    required: false
    default: ''

outputs:
  cache-hit:
    description: 'Whether dependencies were restored from cache'
    value: ${{ steps.deps-cache.outputs.cache-hit }}
  dependency-cache-key:
    description: 'The cache key used for dependencies'
    value: ${{ steps.cache-keys.outputs.dependency-cache-key }}

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Generate cache keys
      id: cache-keys
      shell: bash
      run: |
        echo "dependency-cache-key=${{ runner.os }}-deps-${{ hashFiles('**/pnpm-lock.yaml') }}${{ inputs.cache-key-suffix }}" >> $GITHUB_OUTPUT

    - name: Cache dependencies
      if: inputs.install-dependencies == 'true'
      uses: actions/cache@v4
      id: deps-cache
      with:
        path: |
          ~/.pnpm-store
          node_modules
        key: ${{ steps.cache-keys.outputs.dependency-cache-key }}
        restore-keys: |
          ${{ runner.os }}-deps-${{ hashFiles('**/pnpm-lock.yaml') }}
          ${{ runner.os }}-deps-

    - name: Install dependencies
      if: inputs.install-dependencies == 'true' && steps.deps-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        HUSKY: 0
