services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 24
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://dlc_user:dlc_pass@postgres:5432/dlicious?connection_limit=5&pool_timeout=30
      - DIRECT_URL=postgresql://dlc_user:dlc_pass@postgres:5432/dlicious
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=default
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dlicious
      POSTGRES_USER: dlc_user
      POSTGRES_PASSWORD: dlc_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - '5432:5432'
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ['/bin/sh', '-c', 'redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
